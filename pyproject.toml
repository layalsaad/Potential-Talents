[project]
name = "talent-ranker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "layalsaad", email = "layalsaadeddine@st.ul.edu.lb" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
talent-ranker = "talent_ranker:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "seaborn>=0.13.2",
]
